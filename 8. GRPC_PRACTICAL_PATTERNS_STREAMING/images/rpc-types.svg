<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>The four gRPC call types: unary, server streaming, client streaming, bidirectional streaming</title>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a78d6"/></marker>
    <marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#eb6834"/></marker>
  </defs>
  <rect width="880" height="400" rx="14" fill="#fbfbf9"/>
  <text x="440" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1c1a">The four gRPC call types</text>
  <g font-size="12.5"><rect x="300" y="52" width="12" height="12" rx="2" fill="#2a78d6"/><text x="318" y="63" fill="#1c1c1a">client → server message</text>
  <rect x="480" y="52" width="12" height="12" rx="2" fill="#eb6834"/><text x="498" y="63" fill="#1c1c1a">server → client message</text></g>

  <g font-size="13" fill="#1c1c1a">
    <!-- columns -->
    <g transform="translate(20,80)">
      <rect width="200" height="300" rx="10" fill="#fff" stroke="#e3e3dd"/>
      <text x="100" y="26" text-anchor="middle" font-weight="700">Unary</text>
      <text x="100" y="44" text-anchor="middle" font-size="11.5" fill="#5c5c56" font-family="ui-monospace,Menlo,monospace">rpc Get(Req) returns (Res)</text>
      <text x="36" y="72" text-anchor="middle" font-size="11.5" fill="#5c5c56">client</text><text x="164" y="72" text-anchor="middle" font-size="11.5" fill="#5c5c56">server</text>
      <path d="M36 80 V220 M164 80 V220" stroke="#c9c8c2" stroke-dasharray="4 4"/>
      <path d="M36 110 H160" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#r)"/>
      <path d="M164 160 H40" stroke="#eb6834" stroke-width="2.5" marker-end="url(#l)"/>
      <text x="100" y="250" text-anchor="middle" font-size="12" fill="#5c5c56">1 request → 1 response</text>
      <text x="100" y="274" text-anchor="middle" font-size="12" font-weight="600">GetOrder, CreateUser</text>
    </g>
    <g transform="translate(236,80)">
      <rect width="200" height="300" rx="10" fill="#fff" stroke="#e3e3dd"/>
      <text x="100" y="26" text-anchor="middle" font-weight="700">Server streaming</text>
      <text x="100" y="44" text-anchor="middle" font-size="11.5" fill="#5c5c56" font-family="ui-monospace,Menlo,monospace">returns (stream Res)</text>
      <text x="36" y="72" text-anchor="middle" font-size="11.5" fill="#5c5c56">client</text><text x="164" y="72" text-anchor="middle" font-size="11.5" fill="#5c5c56">server</text>
      <path d="M36 80 V220 M164 80 V220" stroke="#c9c8c2" stroke-dasharray="4 4"/>
      <path d="M36 100 H160" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#r)"/>
      <path d="M164 135 H40" stroke="#eb6834" stroke-width="2.5" marker-end="url(#l)"/>
      <path d="M164 163 H40" stroke="#eb6834" stroke-width="2.5" marker-end="url(#l)"/>
      <path d="M164 191 H40" stroke="#eb6834" stroke-width="2.5" marker-end="url(#l)"/>
      <text x="100" y="250" text-anchor="middle" font-size="12" fill="#5c5c56">1 request → N responses</text>
      <text x="100" y="274" text-anchor="middle" font-size="12" font-weight="600">live prices, order tracking</text>
    </g>
    <g transform="translate(452,80)">
      <rect width="200" height="300" rx="10" fill="#fff" stroke="#e3e3dd"/>
      <text x="100" y="26" text-anchor="middle" font-weight="700">Client streaming</text>
      <text x="100" y="44" text-anchor="middle" font-size="11.5" fill="#5c5c56" font-family="ui-monospace,Menlo,monospace">(stream Req) returns (Res)</text>
      <text x="36" y="72" text-anchor="middle" font-size="11.5" fill="#5c5c56">client</text><text x="164" y="72" text-anchor="middle" font-size="11.5" fill="#5c5c56">server</text>
      <path d="M36 80 V220 M164 80 V220" stroke="#c9c8c2" stroke-dasharray="4 4"/>
      <path d="M36 100 H160" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#r)"/>
      <path d="M36 128 H160" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#r)"/>
      <path d="M36 156 H160" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#r)"/>
      <path d="M164 196 H40" stroke="#eb6834" stroke-width="2.5" marker-end="url(#l)"/>
      <text x="100" y="250" text-anchor="middle" font-size="12" fill="#5c5c56">N requests → 1 response</text>
      <text x="100" y="274" text-anchor="middle" font-size="12" font-weight="600">file upload, metric batches</text>
    </g>
    <g transform="translate(668,80)">
      <rect width="192" height="300" rx="10" fill="#fff" stroke="#e3e3dd"/>
      <text x="96" y="26" text-anchor="middle" font-weight="700">Bidirectional</text>
      <text x="96" y="44" text-anchor="middle" font-size="11.5" fill="#5c5c56" font-family="ui-monospace,Menlo,monospace">(stream) returns (stream)</text>
      <text x="32" y="72" text-anchor="middle" font-size="11.5" fill="#5c5c56">client</text><text x="160" y="72" text-anchor="middle" font-size="11.5" fill="#5c5c56">server</text>
      <path d="M32 80 V220 M160 80 V220" stroke="#c9c8c2" stroke-dasharray="4 4"/>
      <path d="M32 100 H156" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#r)"/>
      <path d="M160 124 H36" stroke="#eb6834" stroke-width="2.5" marker-end="url(#l)"/>
      <path d="M32 148 H156" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#r)"/>
      <path d="M160 166 H36" stroke="#eb6834" stroke-width="2.5" marker-end="url(#l)"/>
      <path d="M160 190 H36" stroke="#eb6834" stroke-width="2.5" marker-end="url(#l)"/>
      <text x="96" y="250" text-anchor="middle" font-size="12" fill="#5c5c56">independent, any order</text>
      <text x="96" y="274" text-anchor="middle" font-size="12" font-weight="600">chat, collaborative editing</text>
    </g>
  </g>
</svg>
