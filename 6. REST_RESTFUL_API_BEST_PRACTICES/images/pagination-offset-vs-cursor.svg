<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="880" height="400" rx="14" fill="#fbfbf9"/>
  <text x="440" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1c1a">Offset vs cursor pagination</text>
  <text x="440" y="60" text-anchor="middle" font-size="13" fill="#5c5c56">Page 3, page size 3. A new row "N" is inserted at the top between requests.</text>

  <text x="30" y="100" font-size="15" font-weight="700" fill="#1c1c1a">Offset</text>
  <text x="100" y="100" font-size="12.5" fill="#5c5c56" font-family="ui-monospace,Menlo,monospace">GET /posts?limit=3&amp;offset=6</text>
  <g font-size="13" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">
    <g transform="translate(30,115)">
      <rect x="0"   width="62" height="40" rx="6" fill="#e9f5ec" stroke="#2e8b57"/><text x="31" y="25">N</text>
      <rect x="68"  width="62" height="40" rx="6" fill="#fff" stroke="#d6d6cf"/><text x="99" y="25">P1</text>
      <rect x="136" width="62" height="40" rx="6" fill="#fff" stroke="#d6d6cf"/><text x="167" y="25">P2</text>
      <rect x="204" width="62" height="40" rx="6" fill="#fff" stroke="#d6d6cf"/><text x="235" y="25">P3</text>
      <rect x="272" width="62" height="40" rx="6" fill="#fff" stroke="#d6d6cf"/><text x="303" y="25">P4</text>
      <rect x="340" width="62" height="40" rx="6" fill="#fff" stroke="#d6d6cf"/><text x="371" y="25">P5</text>
      <rect x="408" width="62" height="40" rx="6" fill="#fde8e6" stroke="#b3261e" stroke-width="2"/><text x="439" y="25">P6</text>
      <rect x="476" width="62" height="40" rx="6" fill="#f3ece7" stroke="#8a4b2a" stroke-width="2"/><text x="507" y="25">P7</text>
      <rect x="544" width="62" height="40" rx="6" fill="#f3ece7" stroke="#8a4b2a" stroke-width="2"/><text x="575" y="25">P8</text>
      <path d="M0 52 H402" stroke="#5c5c56" stroke-width="1.2"/><text x="201" y="70" font-size="11.5" fill="#5c5c56" font-family="-apple-system,Segoe UI,sans-serif">skip 6 rows (DB still reads them)</text>
      <path d="M408 52 H606" stroke="#8a4b2a" stroke-width="2.5"/><text x="507" y="70" font-size="11.5" fill="#8a4b2a" font-family="-apple-system,Segoe UI,sans-serif">returned</text>
    </g>
  </g>
  <g font-size="12.5" fill="#1c1c1a">
    <text x="660" y="130" fill="#b3261e" font-weight="700">✕ P6 shown twice</text>
    <text x="660" y="150" fill="#5c5c56">it was on page 2 before</text>
    <text x="660" y="168" fill="#5c5c56">the insert shifted rows</text>
    <text x="660" y="194" fill="#b3261e" font-weight="700">✕ slow on deep pages</text>
    <text x="660" y="212" fill="#5c5c56">OFFSET 100000 scans 100k</text>
  </g>

  <line x1="30" y1="240" x2="850" y2="240" stroke="#e3e3dd"/>

  <text x="30" y="280" font-size="15" font-weight="700" fill="#1c1c1a">Cursor</text>
  <text x="100" y="280" font-size="12.5" fill="#5c5c56" font-family="ui-monospace,Menlo,monospace">GET /posts?limit=3&amp;after=P6</text>
  <g font-size="13" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">
    <g transform="translate(30,295)">
      <rect x="0"   width="62" height="40" rx="6" fill="#e9f5ec" stroke="#2e8b57"/><text x="31" y="25">N</text>
      <rect x="68"  width="62" height="40" rx="6" fill="#fff" stroke="#d6d6cf"/><text x="99" y="25">P1</text>
      <rect x="136" width="62" height="40" rx="6" fill="#fff" stroke="#d6d6cf"/><text x="167" y="25">P2</text>
      <rect x="204" width="62" height="40" rx="6" fill="#fff" stroke="#d6d6cf"/><text x="235" y="25">P3</text>
      <rect x="272" width="62" height="40" rx="6" fill="#fff" stroke="#d6d6cf"/><text x="303" y="25">P4</text>
      <rect x="340" width="62" height="40" rx="6" fill="#fff" stroke="#d6d6cf"/><text x="371" y="25">P5</text>
      <rect x="408" width="62" height="40" rx="6" fill="#fff" stroke="#1c1c1a" stroke-width="2" stroke-dasharray="4 3"/><text x="439" y="25">P6</text>
      <rect x="476" width="62" height="40" rx="6" fill="#f3ece7" stroke="#8a4b2a" stroke-width="2"/><text x="507" y="25">P7</text>
      <rect x="544" width="62" height="40" rx="6" fill="#f3ece7" stroke="#8a4b2a" stroke-width="2"/><text x="575" y="25">P8</text>
      <rect x="612" width="62" height="40" rx="6" fill="#f3ece7" stroke="#8a4b2a" stroke-width="2"/><text x="643" y="25">P9</text>
      <text x="439" y="-6" font-size="11" fill="#1c1c1a" font-family="-apple-system,Segoe UI,sans-serif">cursor</text>
      <path d="M476 52 H674" stroke="#8a4b2a" stroke-width="2.5"/><text x="575" y="70" font-size="11.5" fill="#8a4b2a" font-family="-apple-system,Segoe UI,sans-serif">next rows after P6 (index seek)</text>
    </g>
  </g>
  <g font-size="12.5">
    <text x="722" y="315" fill="#2e8b57" font-weight="700">✓ no duplicates</text>
    <text x="722" y="341" fill="#2e8b57" font-weight="700">✓ constant speed</text>
    <text x="722" y="367" fill="#5c5c56">✕ no page jumps</text>
  </g>
</svg>
