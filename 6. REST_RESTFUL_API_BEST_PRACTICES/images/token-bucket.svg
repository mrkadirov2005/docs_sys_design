<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1c1c1a"/></marker>
  <marker id="tr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b3261e"/></marker>
  <marker id="tg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2e8b57"/></marker></defs>
  <rect width="880" height="400" rx="14" fill="#fbfbf9"/>
  <text x="440" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1c1a">Token bucket rate limiter</text>
  <text x="440" y="60" text-anchor="middle" font-size="13" fill="#5c5c56">Capacity 5 tokens, refill 1 token per second. Bursts are allowed up to the capacity.</text>

  <g transform="translate(330,70)">
    <text x="110" y="18" text-anchor="middle" font-size="13" fill="#5c5c56">refill +1 token / sec</text>
    <path d="M110 26 V70" stroke="#1c1c1a" stroke-width="1.5" marker-end="url(#t)"/>
    <circle cx="110" cy="44" r="8" fill="#e0a077" stroke="#8a4b2a"/>
    <path d="M20 80 L40 260 H180 L200 80" fill="#fff" stroke="#1c1c1a" stroke-width="2"/>
    <g fill="#e0a077" stroke="#8a4b2a" stroke-width="1.5">
      <circle cx="75" cy="238" r="15"/><circle cx="110" cy="238" r="15"/><circle cx="145" cy="238" r="15"/>
      <circle cx="92" cy="208" r="15"/><circle cx="127" cy="208" r="15"/>
    </g>
    <text x="110" y="150" text-anchor="middle" font-size="13" fill="#5c5c56">5 / 5 tokens</text>
    <text x="110" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1c1a">bucket (per user / API key)</text>
  </g>

  <g font-size="13" fill="#1c1c1a">
    <text x="30" y="150" font-weight="700">Incoming requests</text>
    <g font-family="ui-monospace,Menlo,monospace" font-size="12">
      <rect x="30" y="165" width="90" height="28" rx="6" fill="#fff" stroke="#d6d6cf"/><text x="75" y="184" text-anchor="middle">req 1</text>
      <rect x="30" y="200" width="90" height="28" rx="6" fill="#fff" stroke="#d6d6cf"/><text x="75" y="219" text-anchor="middle">req 2</text>
      <rect x="30" y="235" width="90" height="28" rx="6" fill="#fff" stroke="#d6d6cf"/><text x="75" y="254" text-anchor="middle">…</text>
      <rect x="30" y="270" width="90" height="28" rx="6" fill="#fff" stroke="#d6d6cf"/><text x="75" y="289" text-anchor="middle">req 6</text>
    </g>
    <path d="M130 230 H340" stroke="#1c1c1a" stroke-width="1.5" marker-end="url(#t)"/>
    <text x="235" y="220" text-anchor="middle" font-size="12" fill="#5c5c56">take 1 token each</text>
  </g>

  <g font-size="13">
    <path d="M545 200 H690" stroke="#2e8b57" stroke-width="2" marker-end="url(#tg)"/>
    <text x="700" y="195" font-weight="700" fill="#2e8b57">token available</text>
    <text x="700" y="214" fill="#2e8b57" font-family="ui-monospace,Menlo,monospace" font-size="12">→ 200, forward</text>

    <path d="M540 290 H690" stroke="#b3261e" stroke-width="2" marker-end="url(#tr)"/>
    <text x="700" y="285" font-weight="700" fill="#b3261e">bucket empty</text>
    <text x="700" y="304" fill="#b3261e" font-family="ui-monospace,Menlo,monospace" font-size="12">→ 429 Too Many</text>
    <text x="700" y="320" fill="#b3261e" font-family="ui-monospace,Menlo,monospace" font-size="12">  Retry-After: 1</text>
  </g>
  <text x="440" y="388" text-anchor="middle" font-size="12.5" fill="#5c5c56">Requests 1–5 pass instantly (burst). Request 6 is rejected until a token refills.</text>
</svg>
