<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Protobuf payload size as a percentage of the equivalent JSON, raw and gzipped</title>
<rect width="880" height="440" rx="14" fill="#fcfcfb"/>
<text x="40" y="42" font-size="20" font-weight="700" fill="#0b0b0b">Protobuf payload size as a share of JSON</text>
<text x="40" y="66" font-size="13" fill="#52514e">Same order message at three sizes. Lower is smaller. Measured with protobufjs 8.8 on Node 24.</text>
<rect x="40" y="80" width="12" height="12" rx="2" fill="#2a78d6"/><text x="58" y="91" font-size="13" fill="#0b0b0b">Raw bytes</text>
<rect x="150" y="80" width="12" height="12" rx="2" fill="#eb6834"/><text x="168" y="91" font-size="13" fill="#0b0b0b">After gzip</text>
<line x1="96" x2="800" y1="360.0" y2="360.0" stroke="#e6e5e0" stroke-width="1"/>
<text x="86" y="364.0" text-anchor="end" font-size="12" fill="#52514e">0%</text>
<line x1="96" x2="800" y1="297.5" y2="297.5" stroke="#e6e5e0" stroke-width="1"/>
<text x="86" y="301.5" text-anchor="end" font-size="12" fill="#52514e">25%</text>
<line x1="96" x2="800" y1="235.0" y2="235.0" stroke="#e6e5e0" stroke-width="1"/>
<text x="86" y="239.0" text-anchor="end" font-size="12" fill="#52514e">50%</text>
<line x1="96" x2="800" y1="172.5" y2="172.5" stroke="#e6e5e0" stroke-width="1"/>
<text x="86" y="176.5" text-anchor="end" font-size="12" fill="#52514e">75%</text>
<line x1="96" x2="800" y1="110.0" y2="110.0" stroke="#e6e5e0" stroke-width="1"/>
<text x="86" y="114.0" text-anchor="end" font-size="12" fill="#52514e">100%</text>
<text x="804" y="114.0" font-size="12" fill="#52514e">= JSON</text>
<path d="M235.0 360 V265.8 Q235.0 261.8 239.0 261.8 H255.0 Q259.0 261.8 259.0 265.8 V360 Z" fill="#2a78d6"/>
<path d="M261.0 360 V212.2 Q261.0 208.2 265.0 208.2 H281.0 Q285.0 208.2 285.0 212.2 V360 Z" fill="#eb6834"/>
<text x="247" y="254.8" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">39%</text>
<text x="273" y="201.2" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">61%</text>
<text x="260" y="382" text-anchor="middle" font-size="13" fill="#0b0b0b">1 line item</text>
<text x="260" y="400" text-anchor="middle" font-size="12" fill="#52514e">338 B JSON</text>
<path d="M443.0 360 V251.8 Q443.0 247.8 447.0 247.8 H463.0 Q467.0 247.8 467.0 251.8 V360 Z" fill="#2a78d6"/>
<path d="M469.0 360 V170.8 Q469.0 166.8 473.0 166.8 H489.0 Q493.0 166.8 493.0 170.8 V360 Z" fill="#eb6834"/>
<text x="455" y="240.8" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">45%</text>
<text x="481" y="159.8" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">77%</text>
<text x="468" y="382" text-anchor="middle" font-size="13" fill="#0b0b0b">20 line items</text>
<text x="468" y="400" text-anchor="middle" font-size="12" fill="#52514e">3.2 KB JSON</text>
<path d="M651.0 360 V249.0 Q651.0 245.0 655.0 245.0 H671.0 Q675.0 245.0 675.0 249.0 V360 Z" fill="#2a78d6"/>
<path d="M677.0 360 V153.2 Q677.0 149.2 681.0 149.2 H697.0 Q701.0 149.2 701.0 153.2 V360 Z" fill="#eb6834"/>
<text x="663" y="238.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">46%</text>
<text x="689" y="142.2" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">84%</text>
<text x="676" y="382" text-anchor="middle" font-size="13" fill="#0b0b0b">200 line items</text>
<text x="676" y="400" text-anchor="middle" font-size="12" fill="#52514e">30.6 KB JSON</text>
<line x1="96" x2="800" y1="360" y2="360" stroke="#c9c8c2" stroke-width="1"/>
<text x="832" y="426" text-anchor="end" font-size="12" fill="#52514e">Raw: Protobuf is ~40–46% of JSON. Gzipped: the gap shrinks to 61–84%.</text>
</svg>