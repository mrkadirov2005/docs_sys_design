<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>Anatomy of one gRPC call on an HTTP/2 stream</title>
  <rect width="880" height="440" rx="14" fill="#fbfbf9"/>
  <text x="440" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1c1a">One gRPC call = one HTTP/2 stream</text>
  <text x="440" y="62" text-anchor="middle" font-size="13" fill="#5c5c56">Many calls share a single TCP connection. Each call is headers, length-prefixed messages, then trailers.</text>

  <g font-size="12.5">
    <rect x="40" y="86" width="800" height="36" rx="8" fill="#f3ece7" stroke="#d9c9bd"/>
    <text x="56" y="109" font-weight="700" fill="#1c1c1a">TCP + TLS connection</text>
    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#6f3b20">
      <rect x="250" y="93" width="120" height="22" rx="5" fill="#fff" stroke="#c99f84"/><text x="310" y="108" text-anchor="middle">stream 1 GetOrder</text>
      <rect x="380" y="93" width="130" height="22" rx="5" fill="#fff" stroke="#c99f84"/><text x="445" y="108" text-anchor="middle">stream 3 WatchOrder</text>
      <rect x="520" y="93" width="120" height="22" rx="5" fill="#fff" stroke="#c99f84"/><text x="580" y="108" text-anchor="middle">stream 5 GetOrder</text>
      <text x="660" y="108">… interleaved</text>
    </g>
  </g>

  <g font-size="13">
    <text x="40" y="160" font-weight="700" fill="#2a78d6">① HEADERS frame (request)</text>
    <rect x="40" y="170" width="380" height="118" rx="8" fill="#fff" stroke="#2a78d6"/>
    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1c1c1a">
      <text x="54" y="192">:method POST</text>
      <text x="54" y="210">:path /demo.v1.OrderService/GetOrder</text>
      <text x="54" y="228">content-type application/grpc</text>
      <text x="54" y="246">grpc-timeout 250m     <tspan fill="#5c5c56">(deadline)</tspan></text>
      <text x="54" y="264">authorization Bearer …  <tspan fill="#5c5c56">(metadata)</tspan></text>
      <text x="54" y="282">te trailers</text>
    </g>

    <text x="460" y="160" font-weight="700" fill="#1c1c1a">② DATA frame(s): length-prefixed message</text>
    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" text-anchor="middle">
      <rect x="460" y="176" width="70"  height="46" rx="6" fill="#fff" stroke="#1c1c1a"/><text x="495" y="204">00</text>
      <rect x="536" y="176" width="150" height="46" rx="6" fill="#fff" stroke="#1c1c1a"/><text x="611" y="204">00 00 00 07</text>
      <rect x="692" y="176" width="148" height="46" rx="6" fill="#e9f5ec" stroke="#2e8b57"/><text x="766" y="204">0a 05 6f 72…</text>
    </g>
    <g font-size="11.5" fill="#5c5c56" text-anchor="middle">
      <text x="495" y="240">1 B</text><text x="495" y="255">compressed?</text>
      <text x="611" y="240">4 B big-endian</text><text x="611" y="255">message length</text>
      <text x="766" y="240">protobuf bytes</text><text x="766" y="255">{order_id:"ord_1"}</text>
    </g>
    <text x="460" y="282" font-size="12" fill="#5c5c56">A stream carries 1 message (unary) or many (streaming).</text>
  </g>

  <g font-size="13">
    <text x="40" y="326" font-weight="700" fill="#eb6834">③ HEADERS response   +   ④ DATA response messages   +   ⑤ TRAILERS</text>
    <rect x="40" y="336" width="800" height="80" rx="8" fill="#fff" stroke="#eb6834"/>
    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1c1c1a">
      <text x="54" y="360">:status 200</text>
      <text x="54" y="378">content-type application/grpc</text>
      <text x="54" y="400" fill="#5c5c56">← HTTP is 200 even when the RPC fails</text>
      <text x="470" y="360">grpc-status 5            <tspan fill="#5c5c56">(NOT_FOUND)</tspan></text>
      <text x="470" y="378">grpc-message Order%20ord_9%20not%20found</text>
      <text x="470" y="396">grpc-status-details-bin …  <tspan fill="#5c5c56">(rich errors)</tspan></text>
    </g>
  </g>
</svg>
