<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 478" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>Contract-first code generation pipeline across microservices</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1c1c1a"/></marker></defs>
  <rect width="880" height="478" rx="14" fill="#fbfbf9"/>
  <text x="440" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1c1a">One contract, many languages</text>
  <text x="440" y="62" text-anchor="middle" font-size="13" fill="#5c5c56">The .proto files are the source of truth. CI blocks breaking changes before any code is generated.</text>

  <g font-size="13" fill="#1c1c1a">
    <rect x="30" y="92" width="190" height="150" rx="10" fill="#fff" stroke="#8a4b2a" stroke-width="2"/>
    <text x="125" y="118" text-anchor="middle" font-weight="700">contracts repo</text>
    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#5c5c56">
      <text x="46" y="144">proto/</text>
      <text x="58" y="162">demo/v1/</text>
      <text x="70" y="180">order_service.proto</text>
      <text x="58" y="198">buf.yaml</text>
      <text x="58" y="216">buf.gen.yaml</text>
    </g>

    <path d="M220 167 H262" stroke="#1c1c1a" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="266" y="92" width="200" height="150" rx="10" fill="#fff" stroke="#e3e3dd"/>
    <text x="366" y="118" text-anchor="middle" font-weight="700">CI on every pull request</text>
    <g font-size="12">
      <text x="282" y="146"><tspan font-family="ui-monospace,Menlo,monospace">buf lint</tspan></text>
      <text x="282" y="162" fill="#5c5c56">naming, style, UNSPECIFIED = 0</text>
      <text x="282" y="190"><tspan font-family="ui-monospace,Menlo,monospace">buf breaking</tspan></text>
      <text x="282" y="206" fill="#5c5c56">vs main: no renumbered or</text>
      <text x="282" y="222" fill="#5c5c56">retyped fields, no removals</text>
    </g>
    <text x="366" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#b3261e">✕ breaking → PR blocked</text>

    <path d="M466 167 H508" stroke="#1c1c1a" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="512" y="92" width="150" height="150" rx="10" fill="#f3ece7" stroke="#8a4b2a"/>
    <text x="587" y="124" text-anchor="middle" font-weight="700">buf generate</text>
    <text x="587" y="146" text-anchor="middle" font-size="12" fill="#5c5c56">(or protoc +</text>
    <text x="587" y="162" text-anchor="middle" font-size="12" fill="#5c5c56">language plugins)</text>
    <text x="587" y="196" text-anchor="middle" font-size="12" fill="#5c5c56">messages + client</text>
    <text x="587" y="212" text-anchor="middle" font-size="12" fill="#5c5c56">stubs + server</text>
    <text x="587" y="228" text-anchor="middle" font-size="12" fill="#5c5c56">interfaces</text>

    <path d="M662 120 H700" stroke="#1c1c1a" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M662 167 H700" stroke="#1c1c1a" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M662 214 H700" stroke="#1c1c1a" stroke-width="1.5" marker-end="url(#a)"/>

    <g font-size="12">
      <rect x="704" y="100" width="150" height="38" rx="7" fill="#fff" stroke="#d6d6cf"/>
      <text x="716" y="124"><tspan font-weight="700">Go</tspan> <tspan fill="#5c5c56">module</tspan></text>
      <rect x="704" y="148" width="150" height="38" rx="7" fill="#fff" stroke="#d6d6cf"/>
      <text x="716" y="172"><tspan font-weight="700">TypeScript</tspan> <tspan fill="#5c5c56">npm pkg</tspan></text>
      <rect x="704" y="196" width="150" height="38" rx="7" fill="#fff" stroke="#d6d6cf"/>
      <text x="716" y="220"><tspan font-weight="700">Python</tspan> <tspan fill="#5c5c56">wheel</tspan></text>
    </g>
  </g>

  <line x1="30" y1="292" x2="850" y2="292" stroke="#e3e3dd"/>
  <text x="440" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1c1a">Each team imports only the generated package it needs, pinned to a version</text>

  <g font-size="12.5" fill="#1c1c1a" text-anchor="middle">
    <rect x="60"  y="340" width="220" height="100" rx="10" fill="#fff" stroke="#2a78d6"/>
    <text x="170" y="366" font-weight="700">Order service · Go</text>
    <text x="170" y="388" fill="#5c5c56">implements the</text>
    <text x="170" y="406" fill="#5c5c56">generated server interface</text>
    <text x="170" y="426" font-size="11.5" fill="#2a78d6">contracts/gen/go v1.4.0</text>

    <rect x="330" y="340" width="220" height="100" rx="10" fill="#fff" stroke="#eb6834"/>
    <text x="440" y="366" font-weight="700">Checkout BFF · TypeScript</text>
    <text x="440" y="388" fill="#5c5c56">calls OrderService with</text>
    <text x="440" y="406" fill="#5c5c56">a typed client stub</text>
    <text x="440" y="426" font-size="11.5" fill="#c4521f">@acme/contracts 1.4.0</text>

    <rect x="600" y="340" width="220" height="100" rx="10" fill="#fff" stroke="#2e8b57"/>
    <text x="710" y="366" font-weight="700">Fraud scoring · Python</text>
    <text x="710" y="388" fill="#5c5c56">calls OrderService with</text>
    <text x="710" y="406" fill="#5c5c56">a typed client stub</text>
    <text x="710" y="426" font-size="11.5" fill="#2e8b57">acme-contracts==1.3.2</text>
  </g>
  <path d="M330 390 H284" stroke="#1c1c1a" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M700 442 C 700 462, 240 462, 170 444" stroke="#1c1c1a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
</svg>
